<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Laboratorios de ciberseguridad</title>
  <desc id="desc">Terminal de Kali Linux, análisis de red y pruebas controladas en Windows Server.</desc>
  <defs>
    <radialGradient id="bg" cx="80%" cy="10%" r="95%">
      <stop offset="0" stop-color="#092f3a"/>
      <stop offset="0.5" stop-color="#031f22"/>
      <stop offset="1" stop-color="#021617"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef2e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7ef2e0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e3f3a" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#031f1d"/>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.32"/>
  <circle cx="1000" cy="330" r="180" fill="#0b5d56" opacity="0.28" filter="url(#soft)"/>
  <circle cx="90" cy="650" r="150" fill="#7a3d78" opacity="0.12" filter="url(#soft)"/>

  <!-- Header -->
  <circle cx="66" cy="40" r="5" fill="#7ef2e0"/>
  <text x="84" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="2.4" fill="#d9fffa">CIBERSEGURIDAD · LABORATORIO</text>
  <g>
    <rect x="990" y="25" width="146" height="28" rx="14" fill="#052a27" stroke="#1a5a54"/>
    <circle cx="1008" cy="39" r="3" fill="#7ef2e0"/>
    <text x="1020" y="43" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.4" fill="#7ef2e0">ENTORNO CONTROLADO</text>
  </g>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#12443f"/>

  <!-- Terminal -->
  <rect x="70" y="105" width="650" height="478" rx="12" fill="#021614" stroke="#15544d"/>
  <rect x="70" y="105" width="650" height="38" rx="12" fill="#062724"/>
  <rect x="70" y="131" width="650" height="12" fill="#062724"/>
  <circle cx="94" cy="124" r="5" fill="#f6c9ff" opacity="0.75"/>
  <circle cx="112" cy="124" r="5" fill="#7ef2e0" opacity="0.75"/>
  <circle cx="130" cy="124" r="5" fill="#4f948b" opacity="0.6"/>
  <text x="160" y="129" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.4" fill="#4f948b">kali@lab: ~</text>
  <text x="690" y="129" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.2" fill="#2b756c">zsh</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="16" letter-spacing="0.4">
    <text x="96" y="190" fill="#7ef2e0">$</text>
    <text x="116" y="190" fill="#d9fffa">nmap -sV 10.10.10.0/24</text>
    <text x="96" y="220" fill="#5aa79d" font-size="13">Starting Nmap 7.94 ( https://nmap.org )</text>
    <text x="96" y="246" fill="#5aa79d" font-size="13">Nmap scan report for dc01.lab.local</text>
    <text x="96" y="272" fill="#5aa79d" font-size="13">PORT     STATE   SERVICE</text>
    <text x="96" y="298" fill="#d9fffa" font-size="13">22/tcp   open    ssh</text>
    <text x="96" y="324" fill="#d9fffa" font-size="13">445/tcp  open    microsoft-ds</text>
    <text x="96" y="350" fill="#d9fffa" font-size="13">3389/tcp open    ms-wbt-server</text>
    <text x="96" y="386" fill="#7ef2e0">$</text>
    <text x="116" y="386" fill="#d9fffa">msfconsole -q</text>
    <text x="96" y="416" fill="#f6c9ff" font-size="13">msf6 &gt; use auxiliary/scanner/smb/smb_version</text>
    <text x="96" y="442" fill="#f6c9ff" font-size="13">msf6 &gt; set RHOSTS 10.10.10.0/24</text>
    <text x="96" y="468" fill="#f6c9ff" font-size="13">msf6 &gt; run</text>
    <text x="96" y="504" fill="#5aa79d" font-size="13">[*] Scanned 256 hosts, 3 identified</text>
    <text x="96" y="530" fill="#7ef2e0" font-size="13">[+] Lab evidence captured</text>
    <text x="96" y="556" fill="#7ef2e0">$</text>
    <rect x="116" y="544" width="10" height="16" fill="#7ef2e0" opacity="0.85"/>
  </g>

  <!-- Radar -->
  <g transform="translate(930 280)">
    <circle r="168" fill="none" stroke="#134b46" stroke-width="1.5"/>
    <circle r="124" fill="none" stroke="#134b46" stroke-width="1.2"/>
    <circle r="80" fill="none" stroke="#134b46" stroke-width="1"/>
    <circle r="38" fill="none" stroke="#134b46" stroke-width="1"/>
    <path d="M0 0L168 0A168 168 0 0 0 118 -119Z" fill="url(#sweep)"/>
    <path d="M0 0L124 -70" stroke="#7ef2e0" stroke-width="2" opacity="0.7"/>
    <circle r="6" fill="#7ef2e0" filter="url(#glow)"/>
    <circle cx="72" cy="-48" r="5" fill="#f6c9ff"/>
    <circle cx="-84" cy="36" r="4.5" fill="#7ef2e0"/>
    <circle cx="44" cy="94" r="4" fill="#7ef2e0" opacity="0.8"/>
    <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="#5aa79d">
      <text x="82" y="-42">DC01</text>
      <text x="-138" y="42">WEB01</text>
      <text x="54" y="108">WS-02</text>
    </g>
  </g>

  <!-- Shield badge -->
  <g transform="translate(930 100)">
    <path d="M0 0L34 12V42C34 66 18 82 0 90C-18 82 -34 66 -34 42V12Z" fill="#052a27" stroke="#7ef2e0" stroke-width="1.6"/>
    <path d="M-12 42L-3 51L14 32" fill="none" stroke="#7ef2e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Server cards -->
  <g>
    <rect x="760" y="520" width="176" height="64" rx="8" fill="#052a27" stroke="#1a5a54"/>
    <circle cx="782" cy="546" r="4" fill="#7ef2e0"/>
    <text x="794" y="550" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="#b8e8e1">KALI LINUX</text>
    <text x="780" y="570" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="1" fill="#4f948b">ATTACK / AUDIT</text>
  </g>
  <g>
    <rect x="952" y="520" width="188" height="64" rx="8" fill="#052a27" stroke="#1a5a54"/>
    <circle cx="974" cy="546" r="4" fill="#f6c9ff"/>
    <text x="986" y="550" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.2" fill="#b8e8e1">WINDOWS SERVER</text>
    <text x="972" y="570" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="1" fill="#4f948b">TARGET / DEFENSE</text>
  </g>

  <!-- Bottom tags -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">
    <rect x="70" y="622" width="152" height="38" rx="19" fill="#052a27" stroke="#15544d"/>
    <text x="90" y="645" fill="#b8e8e1">KALI LINUX</text>
    <rect x="236" y="622" width="152" height="38" rx="19" fill="#052a27" stroke="#15544d"/>
    <text x="256" y="645" fill="#b8e8e1">METASPLOIT</text>
    <rect x="402" y="622" width="118" height="38" rx="19" fill="#052a27" stroke="#15544d"/>
    <text x="422" y="645" fill="#b8e8e1">NMAP</text>
    <rect x="534" y="622" width="152" height="38" rx="19" fill="#052a27" stroke="#15544d"/>
    <text x="554" y="645" fill="#b8e8e1">WIRESHARK</text>
    <rect x="700" y="622" width="118" height="38" rx="19" fill="#052a27" stroke="#15544d"/>
    <text x="720" y="645" fill="#b8e8e1">OSINT</text>
  </g>
  <g>
    <circle cx="858" cy="641" r="4" fill="#7ef2e0"/>
    <text x="872" y="645" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.4" fill="#7ef2e0">PRUEBAS AUTORIZADAS</text>
  </g>
</svg>
