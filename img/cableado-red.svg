<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Instalación de cableado de red</title>
  <desc id="desc">Patch panel y switch conectados con cableado estructurado, etiquetado y probado.</desc>
  <defs>
    <radialGradient id="bg" cx="20%" cy="0%" r="95%">
